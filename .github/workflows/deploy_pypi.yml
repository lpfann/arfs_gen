name: Deploy to PyPI

on:
  release:
    types: [created, published, edited] # Only deploy when publishing github releases

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Load cached Poetry installation
      id: cached-poetry
      uses: actions/cache@v4
      with:
        path: ~/.local
        key: poetry-${{ runner.os }}-deploy
        
    - name: Install Poetry
      if: steps.cached-poetry.outputs.cache-hit != 'true'
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
        
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-3.12-${{ hashFiles('**/poetry.lock') }}
        
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root
      
    - name: Install project
      run: poetry install --no-interaction
      
    - name: Update version to match release tag
      run: |
        # Extract version from GitHub release tag (remove 'v' prefix if present)
        RELEASE_VERSION="${{ github.event.release.tag_name }}"
        VERSION="${RELEASE_VERSION#v}"
        echo "Setting version to: $VERSION"
        poetry version "$VERSION"
        
    - name: Configure Poetry for PyPI
      run: poetry config pypi-token.pypi ${{ secrets.POETRY_PYPI_TOKEN_PYPI }}
      
    - name: Deploy using poetry
      run: poetry publish --build

